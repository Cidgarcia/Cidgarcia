<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">Cid Garcia — Desenvolvedor Full Stack</title>
  <desc id="desc">Banner moderno estilo dark/cyber com gradientes azuis, efeitos glow e arquitetura de software.</desc>
  
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="50%" stop-color="#0a152b"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Glowing Pill Gradient -->
    <linearGradient id="glowCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142645" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a1529" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1d3557" stroke-width="0.75" opacity="0.35"/>
      <circle cx="40" cy="40" r="1.2" fill="#58a6ff" opacity="0.2"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="380" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="380" rx="16" fill="url(#grid)"/>

  <!-- Ambient Glow Circles -->
  <circle cx="1100" cy="90" r="180" fill="#3b82f6" opacity="0.12" filter="url(#glow)"/>
  <circle cx="180" cy="300" r="140" fill="#8b5cf6" opacity="0.08" filter="url(#glow)"/>

  <!-- Left Accent Bar -->
  <rect x="54" y="55" width="4" height="270" rx="2" fill="url(#accent)"/>

  <!-- Left Content: Profile Info -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- Tag -->
    <rect x="80" y="58" width="220" height="28" rx="14" fill="#0d213f" stroke="#2563eb" stroke-width="1"/>
    <circle cx="94" cy="72" r="4" fill="#10b981"/>
    <text x="108" y="77" font-size="12" font-weight="600" letter-spacing="1.5" fill="#93c5fd">OPEN TO WORK · JÚNIOR</text>

    <!-- Name Header -->
    <text x="78" y="152" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Cid Garcia<tspan fill="#58a6ff">.</tspan>
    </text>

    <!-- Subtitle -->
    <text x="80" y="196" font-size="22" font-weight="600" fill="url(#accent)">
      Full Stack Developer &amp; Engenharia de Computação
    </text>

    <!-- University & Mission -->
    <text x="80" y="235" font-size="16" fill="#94a3b8">
      🎓 UNIVASF — Universidade Federal do Vale do São Francisco
    </text>
    <text x="80" y="265" font-size="15" fill="#64748b">
      Construindo sistemas robustos para gestão, logística, web e IA.
    </text>

    <!-- Tech Badges on Banner -->
    <g transform="translate(80, 292)" font-family="monospace" font-size="12" font-weight="600">
      <rect x="0" y="0" width="85" height="24" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="12" y="16" fill="#38bdf8">React</text>
      
      <rect x="95" y="0" width="95" height="24" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="107" y="16" fill="#38bdf8">Node.js</text>
      
      <rect x="200" y="0" width="115" height="24" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="212" y="16" fill="#38bdf8">TypeScript</text>
      
      <rect x="325" y="0" width="110" height="24" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="337" y="16" fill="#38bdf8">PostgreSQL</text>
      
      <rect x="445" y="0" width="90" height="24" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="457" y="16" fill="#38bdf8">Docker</text>
    </g>
  </g>

  <!-- Right Visual: Architecture Diagram -->
  <!-- Connecting Circuit Lines -->
  <g stroke="#2563eb" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 940 120 L 940 170 L 820 170 L 820 220"/>
    <path d="M 940 170 L 1060 170 L 1060 220"/>
    <circle cx="940" cy="170" r="4" fill="#60a5fa"/>
  </g>

  <!-- Cards -->
  <g font-family="monospace" font-size="14" text-anchor="middle">
    <!-- Frontend Node -->
    <rect x="830" y="70" width="220" height="52" rx="10" fill="url(#glowCard)" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="852" cy="96" r="5" fill="#38bdf8"/>
    <text x="945" y="101" font-weight="700" fill="#60a5fa">&lt; Frontend &amp; UI /&gt;</text>

    <!-- Core Logic Node -->
    <rect x="710" y="220" width="220" height="52" rx="10" fill="url(#glowCard)" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="732" cy="246" r="5" fill="#818cf8"/>
    <text x="825" y="251" font-weight="700" fill="#a5b4fc">{ Backend &amp; APIs }</text>

    <!-- Cloud & Data Node -->
    <rect x="950" y="220" width="220" height="52" rx="10" fill="url(#glowCard)" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="972" cy="246" r="5" fill="#c084fc"/>
    <text x="1065" y="251" font-weight="700" fill="#d8b4fe">[ Cloud &amp; DB ]</text>
  </g>

  <!-- Bottom Code Line Indicator -->
  <g font-family="monospace" font-size="11" fill="#475569" text-anchor="end">
    <text x="1230" y="350">git commit -m "build with purpose"</text>
  </g>
</svg>
